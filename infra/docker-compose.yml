# MongoDB local para os exercicios da disciplina.
#   subir:   docker compose -f infra/docker-compose.yml up -d
#   parar:   docker compose -f infra/docker-compose.yml down
#   apagar:  docker compose -f infra/docker-compose.yml down -v   (destroi os dados)
# Nome de projeto fixo: o compose do zapagente tambem roda de uma pasta 'infra'
# e sem isso os containers dele aparecem como 'orphans' deste projeto.
name: nosql-unipe

services:
  mongo:
    image: mongo:7
    container_name: nosql-unipe-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI web para inspecionar as collections sem instalar o Compass.
  mongo-express:
    image: mongo-express:1.0.2
    container_name: nosql-unipe-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
